<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Generative Engine Optimization (GEO) & Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "@id": "https://nandan645.github.io/wallhaven-mobile/#app",
        "name": "Wallhaven Mobile",
        "url": "https://nandan645.github.io/wallhaven-mobile/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "All (Web, Android, iOS)",
        "description": "Mobile-first web application designed for exploring and downloading high-resolution portrait phone wallpapers with natural uncropped aspect ratios, instant category/color filters, and 1-click downloads.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "screenshot": "https://nandan645.github.io/wallhaven-mobile/screenshots/01-gallery.png",
        "browserRequirements": "Requires JavaScript and modern browser support"
      },
      {
        "@type": "FAQPage",
        "@id": "https://nandan645.github.io/wallhaven-mobile/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Wallhaven Mobile?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Wallhaven Mobile is a fast, clean, mobile-first web app tailored for browsing and downloading high-resolution portrait wallpapers for smartphone screens directly from Wallhaven."
            }
          },
          {
            "@type": "Question",
            "name": "How does Wallhaven Mobile maintain natural image aspect ratios?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Wallhaven Mobile uses uncropped original thumbnail dimensions and an intelligent shortest-column masonry algorithm, preventing awkward stretching or letterboxing."
            }
          },
          {
            "@type": "Question",
            "name": "How do I filter wallpapers by color or category?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use the top filter bar to toggle General, Anime, or People categories, select from a 28-color palette, sort by Date Added, Toplist, Views, or Favorites, and switch ascending or descending order."
            }
          },
          {
            "@type": "Question",
            "name": "Is Wallhaven Mobile free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, Wallhaven Mobile is 100% free and open-source, powered by the public Wallhaven.cc API."
            }
          }
        ]
      }
    ]
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="top-row">
        <h1 class="brand">Wallhaven <span>Mobile</span></h1>
        <form id="searchForm">
          <input id="query" placeholder="Search portrait wallpapers..." autocomplete="off" />
          <button class="search-btn" type="submit">Search</button>
        </form>
      </div>

      <div class="filter-row">
        <!-- Category Filter Group: General, Anime, People -->
        <div class="btn-group" role="group" aria-label="Categories">
          <button type="button" class="cat-btn active" data-cat="general">General</button>
          <button type="button" class="cat-btn active" data-cat="anime">Anime</button>
          <button type="button" class="cat-btn" data-cat="people">People</button>
        </div>

        <!-- Secondary Filters: Color, Date Added, Order -->
        <div class="filter-secondary">
          <!-- Color Dropdown -->
          <div class="dropdown-wrapper" id="colorDropdownWrapper">
            <button type="button" class="filter-btn" id="colorBtn" aria-expanded="false" aria-haspopup="true">
              <span class="color-dot" id="activeColorDot" style="display:none"></span>
              <span id="colorBtnLabel">Color</span>
              <span class="arrow">▾</span>
            </button>
            <div class="dropdown-menu color-menu" id="colorMenu">
              <div class="color-menu-header">
                <span>Filter by Color</span>
                <button type="button" class="clear-color-link" id="clearColorBtn">Clear</button>
              </div>
              <div class="color-grid" id="colorGrid"></div>
            </div>
          </div>

          <!-- Sort Dropdown -->
          <div class="dropdown-wrapper" id="sortDropdownWrapper">
            <button type="button" class="filter-btn" id="sortBtn" aria-expanded="false" aria-haspopup="true">
              <span id="sortBtnLabel">Date Added</span>
              <span class="arrow">▾</span>
            </button>
            <div class="dropdown-menu sort-menu" id="sortMenu">
              <button type="button" class="sort-item active" data-sort="date_added">Date Added</button>
              <button type="button" class="sort-item" data-sort="relevance">Relevance</button>
              <button type="button" class="sort-item" data-sort="random">Random</button>
              <button type="button" class="sort-item" data-sort="views">Views</button>
              <button type="button" class="sort-item" data-sort="favorites">Favorites</button>
              <button type="button" class="sort-item" data-sort="toplist">Toplist</button>
              <button type="button" class="sort-item" data-sort="hot">Hot</button>
            </div>
          </div>

          <!-- Sort Order Button: [ ↓ ] / [ ↑ ] -->
          <button type="button" class="filter-btn order-btn" id="orderBtn" title="Sort Order: Descending" aria-label="Toggle sort order">
            <span id="orderIcon">↓</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h2 class="sr-only">High-Resolution Portrait Wallpapers for Mobile Screens</h2>

    <noscript>
      <div class="noscript-banner">
        <p><strong>Wallhaven Mobile</strong> provides high-resolution 4K and HD portrait wallpapers for mobile phones. Please enable JavaScript in your browser to load and interact with the dynamic wallpaper gallery.</p>
      </div>
    </noscript>

    <!-- Strictly 2 Columns -->
    <div class="gallery" id="gallery">
      <div class="column" id="col-0"></div>
      <div class="column" id="col-1"></div>
    </div>

    <div id="sentinel"></div>
    <div id="footer">Loading wallpapers...</div>
  </main>

  <!-- Lightbox Modal -->
  <dialog id="lightboxModal" class="lightbox">
    <div class="lightbox-card">
      <button type="button" class="close-btn" id="closeLightbox" aria-label="Close">&times;</button>
      <div class="lightbox-media">
        <div class="lightbox-loader" id="lightboxLoader">
          <div class="spinner"></div>
          <span class="loader-text">Loading wallpaper...</span>
        </div>
        <img id="lightboxImg" src="" alt="Wallpaper preview" />
      </div>
      <div class="lightbox-footer">
        <div class="lightbox-meta">
          <span id="lightboxRes" class="lightbox-title"></span>
          <span id="lightboxDetails" class="lightbox-sub"></span>
        </div>
        <div class="lightbox-actions">
          <button type="button" id="lightboxDownload" class="btn-action primary">
            Download ↓
          </button>
          <a id="lightboxWallhaven" class="btn-action secondary" href="" target="_blank" rel="noopener noreferrer">
            Wallhaven
          </a>
        </div>
      </div>
    </div>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
